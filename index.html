<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENJET 재무회계 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.7.1/lib/msal-browser.min.js"></script>
<script>
// MSAL 로드 실패(CDN 차단 등) 대비 대체 로더
window.addEventListener("DOMContentLoaded", function(){
  if (typeof msal === "undefined") {
    var s = document.createElement("script");
    s.src = "https://alcdn.msauth.net/browser/2.38.4/js/msal-browser.min.js";
    s.onload = function(){ if (typeof initAuth === "function") initAuth(); };
    document.head.appendChild(s);
  }
});
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f4f6fa; --bg2:#fff; --bg3:#f8f9fc;
  --p:#1a6fd4; --pd:#e6f0fc; --p2:#0f4c81;
  --t1:#1a202c; --t2:#4a5568; --t3:#9ca3af;
  --border:#e5e7eb; --border2:#d1d5db;
  --g:#10b981; --gd:#d1fae5; --r:#dc2626; --rd:#fee2e2; --y:#d97706; --yd:#fef3c7;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow2:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06);
  --shadow3:0 10px 15px rgba(0,0,0,.08),0 4px 6px rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic','Segoe UI',sans-serif;background:var(--bg);color:var(--t1);font-size:14px}
button{font-family:inherit;cursor:pointer}
a{color:inherit}

/* ===== 로그인 게이트 ===== */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f4c81,#1a6fd4);z-index:100}
.gate-card{background:#fff;border-radius:16px;padding:48px 44px;width:380px;text-align:center;box-shadow:var(--shadow3)}
.gate-logo{font-size:26px;font-weight:800;color:var(--p2);letter-spacing:-.5px}
.gate-logo span{color:var(--p)}
.gate-sub{color:var(--t2);margin:8px 0 32px;font-size:13px}
.gate-btn{width:100%;padding:13px;background:var(--p);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;transition:.15s}
.gate-btn:hover{background:var(--p2)}
.gate-note{margin-top:18px;font-size:11px;color:var(--t3)}

/* ===== 레이아웃 ===== */
#app{display:none;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;height:100vh}
.brand{padding:20px 22px;font-size:18px;font-weight:800;color:var(--p2);border-bottom:1px solid var(--border)}
.brand span{color:var(--p)}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--t3);margin-top:2px}
.nav{flex:1;padding:12px 10px}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:9px;color:var(--t2);font-weight:600;font-size:14px;margin-bottom:2px;transition:.12s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--bg3)}
.nav-item.on{background:var(--pd);color:var(--p)}
.nav-ico{width:18px;text-align:center;font-size:16px}
.nav-foot{padding:14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.nav-foot .who{flex:1;min-width:0}
.nav-foot .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-foot .em{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logout{background:none;border:none;color:var(--t3);font-size:16px}
.logout:hover{color:var(--r)}

.main{margin-left:220px;flex:1;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar h1{font-size:19px;font-weight:700}
.topbar .sub{font-size:12px;color:var(--t3);margin-top:2px}
.content{padding:24px 28px}
.page{display:none}
.page.on{display:block}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--yd);color:var(--y);vertical-align:middle;margin-left:8px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow)}
.kpi .lab{font-size:12px;color:var(--t2);font-weight:600}
.kpi .val{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.kpi .delta{font-size:12px;margin-top:4px;font-weight:600}
.kpi .up{color:var(--g)} .kpi .down{color:var(--r)}
.kpi .accent{height:3px;border-radius:3px;margin-top:14px;background:var(--p)}

.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow)}
.card h3{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.card-chart{position:relative;height:260px}

/* 결재문서 */
.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{padding:9px 12px;border:1px solid var(--border2);border-radius:8px;font-size:13px;font-family:inherit}
.filters input{flex:1;min-width:180px}
.filters .btn{padding:9px 18px;background:var(--p);color:#fff;border:none;border-radius:8px;font-weight:600}
.tablewrap{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.tablewrap.full{width:100%}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;font-size:12.5px;text-align:left;border-bottom:1px solid var(--border)}
th{background:var(--bg3);font-weight:700;color:var(--t2);position:sticky;top:0;z-index:1}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--pd)}
tbody tr.sel{background:var(--pd)}
.tbl-scroll{max-height:calc(100vh - 220px);overflow:auto}
.dot-c{color:var(--g)} .dot-n{color:var(--t3)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.st{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.st.완료{background:var(--gd);color:#047857}
.st.진행중{background:var(--yd);color:var(--y)}
.st.반려{background:var(--rd);color:var(--r)}

/* 문서 본문 모달 (여러 개 스택) */
#modalLayer{position:fixed;inset:0;pointer-events:none;z-index:99999}
.docmodal{position:fixed;background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);
  display:flex;flex-direction:column;overflow:hidden;pointer-events:auto;border:1px solid var(--border)}
.docmodal .mbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg3);
  border-bottom:1px solid var(--border);cursor:move;user-select:none}
.docmodal .mbar .mtit{font-weight:700;font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.docmodal .mbar .tag{font-size:10px;padding:2px 7px;border-radius:9px;background:var(--pd);color:var(--p);font-weight:700}
.docmodal .mbar button{border:none;background:none;cursor:pointer;font-size:15px;padding:2px 6px;border-radius:6px;color:var(--t2)}
.docmodal .mbar button:hover{background:var(--border)}
.docmodal .mmeta{padding:8px 14px;font-size:12px;color:var(--t2);border-bottom:1px solid var(--border);line-height:1.6;max-height:120px;overflow:auto}
.docmodal .mmeta b{color:var(--t1)}
.docmodal .matts{padding:6px 14px;font-size:12px;border-bottom:1px solid var(--border)}
.docmodal .matts a{color:var(--p);text-decoration:none;margin-right:12px}
.docmodal .matts a:hover{text-decoration:underline}
.docmodal iframe{flex:1;width:100%;border:none}
.docmodal .mresize{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;
  background:linear-gradient(135deg,transparent 50%,var(--t3) 50%);border-bottom-right-radius:12px}

/* 예산 placeholder */
.bud-grid{width:100%}
.bud-grid td.num{font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--p)}
.muted{color:var(--t3);font-size:12px}
.empty-state{padding:60px 20px;text-align:center;color:var(--t3)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--p);border-radius:50%;animation:s 0.7s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.split{grid-template-columns:1fr}.detail{position:static}}
</style>
</head>
<body>

<!-- 로그인 게이트 -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-logo">EN<span>JET</span></div>
    <div class="gate-sub">재무회계 대시보드</div>
    <button class="gate-btn" onclick="signIn()">
      <svg width="18" height="18" viewBox="0 0 21 21"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
      Microsoft 계정으로 로그인
    </button>
    <div class="gate-note">엔젯(주) 임직원 계정으로 로그인하세요</div>
  </div>
</div>

<!-- 앱 -->
<div id="app">
<div class="layout">
  <aside class="sidebar">
    <div class="brand">EN<span>JET</span> 재무<br><small>다우오피스 결재 · 재무회계</small></div>
    <nav class="nav">
      <button class="nav-item on" data-tab="docs"><span class="nav-ico">📑</span> 결재문서</button>
    </nav>
    <div class="nav-foot">
      <div class="avatar" id="avatar">?</div>
      <div class="who"><div class="nm" id="userName">-</div><div class="em" id="userMail">-</div></div>
      <button class="logout" onclick="signOut()" title="로그아웃">⏻</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div><h1 id="pageTitle">결재문서</h1><div class="sub" id="pageSub">다우오피스 결재문서 조회</div></div>
      <div class="muted" id="conn"></div>
    </div>
    <div class="content">

      <!-- 결재문서 (do_portal 연동) -->
      <section class="page on" id="page-docs">
        <div class="filters">
          <select id="formSel"><option value="지출결의서(엔젯)">지출결의서(엔젯)</option></select>
          <input id="q" placeholder="제목 / 기안자 검색" onkeydown="if(event.key==='Enter')loadDocs()">
          <button class="btn" onclick="loadDocs()">조회</button>
        </div>
        <div class="tablewrap full">
          <div class="tbl-scroll">
            <table><thead><tr><th>기안일</th><th>양식</th><th>제목</th><th>기안자</th><th>부서</th><th>상태</th><th>캐시</th></tr></thead>
            <tbody id="docRows"><tr><td colspan="7" class="empty-state">조회를 눌러주세요</td></tr></tbody></table>
          </div>
        </div>
      </section>

    </div>
  </div>
</div>

<!-- 문서 본문 모달 레이어 (여러 개 스택) -->
<div id="modalLayer"></div>
</div>

<script>
/* ===== 설정 ===== */
// 서버(다우 포털)는 메인 server.py(5000)에 합쳐져 있고, 터널 주소는 매번 바뀌므로
// SharePoint server-endpoint.json 에서 현재 주소를 읽어 따라간다 (메일/ERP 대시보드와 동일).
let PORTAL_BASE = "";   // resolveServerEndpoint() 가 채움
const SERVER_ENDPOINT_SITE = "enjetco.sharepoint.com:/sites/TIC";
const SERVER_ENDPOINT_PATH = "01.통합관리/99.서버/server-endpoint.json";
let _epDriveId = null;

async function graphToken(){
  await pca.initialize();
  const acct = pca.getActiveAccount() || pca.getAllAccounts()[0];
  if(!acct) throw new Error("로그인 필요");
  const scopes = ["Sites.ReadWrite.All","Files.ReadWrite.All"];
  try{ const r = await pca.acquireTokenSilent({scopes, account:acct}); return r.accessToken; }
  catch(e){ const r = await pca.acquireTokenPopup({scopes}); return r.accessToken; }
}
async function resolveServerEndpoint(){
  try{
    const t = await graphToken();
    if(!_epDriveId){
      const r1 = await fetch(`https://graph.microsoft.com/v1.0/sites/${SERVER_ENDPOINT_SITE}`,{headers:{Authorization:"Bearer "+t}});
      const sid = (await r1.json()).id;
      const r2 = await fetch(`https://graph.microsoft.com/v1.0/sites/${sid}/drive`,{headers:{Authorization:"Bearer "+t}});
      _epDriveId = (await r2.json()).id;
    }
    const enc = SERVER_ENDPOINT_PATH.split("/").map(encodeURIComponent).join("/");
    const r = await fetch(`https://graph.microsoft.com/v1.0/drives/${_epDriveId}/root:/${enc}:/content`,{headers:{Authorization:"Bearer "+t}});
    if(r.ok){
      const d = await r.json();
      if(d && d.url){ PORTAL_BASE = String(d.url).replace(/\/+$/,''); }
    }
  }catch(e){ console.warn("터널 주소 조회 실패:", e.message); }
  if(location.hostname === "localhost" && !PORTAL_BASE) PORTAL_BASE = "http://localhost:5000";
  document.getElementById("conn").textContent = PORTAL_BASE ? ("서버: " + PORTAL_BASE) : "서버 주소 미확인";
  return PORTAL_BASE;
}

const msalConfig = {
  auth: {
    clientId: "76793776-3330-496f-97f1-9f0c034f3f07",
    authority: "https://login.microsoftonline.com/58b310e1-9278-47ab-8e49-792728818c9e",
    redirectUri: location.origin + location.pathname
  },
  cache: { cacheLocation: "localStorage" }
};
</script>
<script>
/* ===== MSAL ===== */
let pca;

async function initAuth(){
  if(typeof msal === "undefined"){ setTimeout(initAuth, 150); return; }  // CDN 로드 대기
  pca = new msal.PublicClientApplication(msalConfig);
  await pca.initialize();
  const resp = await pca.handleRedirectPromise().catch(()=>null);
  let acct = (resp && resp.account) || pca.getAllAccounts()[0];
  if(acct){ showApp(acct); }
}
function signIn(){ if(!pca){ setTimeout(signIn,200); return; } pca.loginRedirect({ scopes:["User.Read"] }); }
function signOut(){ if(pca) pca.logoutRedirect(); }
function showApp(acct){
  pca.setActiveAccount(acct);
  document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="block";
  const nm = acct.name || acct.username;
  document.getElementById("userName").textContent = nm;
  document.getElementById("userMail").textContent = acct.username;
  document.getElementById("avatar").textContent = (nm||"?").trim().slice(0,1);
  initForms();
}
initAuth();

/* ===== 탭 (결재문서 단일) ===== */
document.querySelectorAll(".nav-item").forEach(b=>b.onclick=()=>{
  if(!window._docsLoaded) initForms();
});

/* ===== 결재문서: do_portal 연동 ===== */
async function initForms(){
  window._docsLoaded=true;
  await resolveServerEndpoint();
  // 양식 드롭다운 동적 로딩
  try{
    const r=await fetch(`${PORTAL_BASE}/daou/api/forms`);
    const forms=await r.json();
    const sel=document.getElementById("formSel");
    sel.innerHTML=forms.map(f=>`<option value="${esc(f.form)}">${esc(f.form)} (${f.n})</option>`).join('');
    // 재무 핵심 양식을 기본 선택
    const def=forms.find(f=>f.form==="지출결의서(엔젯)");
    if(def) sel.value="지출결의서(엔젯)";
  }catch(e){ console.warn("양식 목록 로딩 실패:", e.message); }
  loadDocs();
}
async function loadDocs(){
  const form=document.getElementById("formSel").value;
  const q=document.getElementById("q").value;
  const tb=document.getElementById("docRows");
  tb.innerHTML='<tr><td colspan="7" class="empty-state"><span class="spin"></span> 불러오는 중…</td></tr>';
  if(!PORTAL_BASE) await resolveServerEndpoint();
  try{
    const r=await fetch(`${PORTAL_BASE}/daou/api/docs?limit=300&form=${encodeURIComponent(form)}&q=${encodeURIComponent(q)}`);
    const d=await r.json();
    if(!d.length){ tb.innerHTML='<tr><td colspan="7" class="empty-state">문서가 없습니다</td></tr>'; return; }
    tb.innerHTML=d.map(x=>`<tr data-id="${esc(String(x.docId))}" data-title="${esc(x.제목||'')}">
      <td>${(x.기안일||'').replace('T',' ').slice(0,16)}</td><td>${esc(form)}</td>
      <td>${esc(x.제목||'')}</td><td>${esc(x.기안자||'')}</td><td>${esc(x.기안부서||'')}</td>
      <td><span class="st ${x.상태}">${x.상태||''}</span></td>
      <td class="${x.cached?'dot-c':'dot-n'}">${x.cached?'●':'○'}</td></tr>`).join('');
    tb.querySelectorAll("tr[data-id]").forEach(tr=>{
      tr.onclick=()=>openDoc(tr.dataset.id, tr.dataset.title);
    });
  }catch(e){
    tb.innerHTML=`<tr><td colspan="7" class="empty-state">포털 연결 실패<br><span class="muted">${PORTAL_BASE} 서버 확인</span></td></tr>`;
  }
}

/* ===== 문서 본문 모달 (여러 개 스택, 드래그/리사이즈) ===== */
let _zTop = 100000, _modalN = 0;
function openDoc(id, title){
  const layer = document.getElementById("modalLayer");
  const off = (_modalN++ % 6) * 28;
  const w = Math.min(980, window.innerWidth - 80);
  const h = Math.min(760, window.innerHeight - 80);
  const m = document.createElement("div");
  m.className = "docmodal";
  m.style.left = (window.innerWidth - w)/2 + off + "px";
  m.style.top  = (window.innerHeight - h)/2 + off - 20 + "px";
  m.style.width = w + "px"; m.style.height = h + "px";
  m.style.zIndex = ++_zTop;
  m.innerHTML = `
    <div class="mbar">
      <span class="mtit">${esc(title||id)}</span>
      <span class="tag" data-src>…</span>
      <button title="새 탭" data-open>↗</button>
      <button title="닫기" data-close>✕</button>
    </div>
    <div class="mmeta" data-meta><span class="spin"></span> 조회 중…</div>
    <div class="matts" data-atts style="display:none"></div>
    <iframe data-frame></iframe>
    <div class="mresize"></div>`;
  layer.appendChild(m);

  // 최상단으로 (클릭 시)
  m.addEventListener("mousedown", ()=>{ m.style.zIndex = ++_zTop; });
  // 닫기
  m.querySelector("[data-close]").onclick = ()=> m.remove();
  // 본문 즉시 로드 (iframe)
  m.querySelector("[data-frame]").src = `${PORTAL_BASE}/daou/body/${id}`;
  m.querySelector("[data-open]").onclick = ()=> window.open(`${PORTAL_BASE}/daou/body/${id}`,"_blank");

  // 메타/첨부 비동기 로드
  fetch(`${PORTAL_BASE}/daou/api/doc/${id}`).then(r=>r.json()).then(meta=>{
    m.querySelector("[data-src]").textContent = meta._source||"";
    const line=(meta.line||[]).filter(l=>l.name).map(l=>`${esc(l.name)}(${esc(l.status||'')})`).join(' → ');
    m.querySelector("[data-meta]").innerHTML =
      `<b>${esc(meta.docNumber||id)}</b> · ${esc(meta.drafter||'')} / ${esc(meta.dept||'')} · ${esc(meta.draftDate||'')}<br>`+
      (line?`결재선: ${line}<br>`:'')+
      (meta.total?`<b>합계: ${esc(meta.total)}</b>`:'');
    const atts=(meta.attaches||[]).filter(f=>f.url).map(f=>
      `<a href="${PORTAL_BASE}/daou/dl?u=${encodeURIComponent(f.url)}" target="_blank">📄 ${esc(f.name)}</a>`).join('');
    if(atts){ const a=m.querySelector("[data-atts]"); a.style.display="block"; a.innerHTML=atts; }
  }).catch(()=>{ m.querySelector("[data-meta]").textContent="(메타 조회 실패)"; });

  // 드래그
  const bar = m.querySelector(".mbar");
  bar.addEventListener("mousedown", e=>{
    if(e.target.tagName==="BUTTON") return;
    const sx=e.clientX, sy=e.clientY, ol=m.offsetLeft, ot=m.offsetTop;
    const mv=ev=>{ m.style.left=ol+ev.clientX-sx+"px"; m.style.top=Math.max(0,ot+ev.clientY-sy)+"px"; };
    const up=()=>{document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);};
    document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up);
  });
  // 리사이즈
  const rz = m.querySelector(".mresize");
  rz.addEventListener("mousedown", e=>{
    e.stopPropagation();
    const sx=e.clientX, sy=e.clientY, ow=m.offsetWidth, oh=m.offsetHeight;
    const mv=ev=>{ m.style.width=Math.max(360,ow+ev.clientX-sx)+"px"; m.style.height=Math.max(260,oh+ev.clientY-sy)+"px"; };
    const up=()=>{document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);};
    document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up);
  });
}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function initBudget(){
  const rows=[['재료비',1200,840],['외주비',600,510],['노무비',900,612],['출장비',150,98],['경비',300,201],['판관비',450,289]];
  document.getElementById("budRows").innerHTML=rows.map(([n,a,u])=>{
    const rate=Math.round(u/a*100), bal=a-u, col=rate>90?'var(--r)':rate>70?'var(--y)':'var(--p)';
    return `<tr><td>${n}</td><td class="num">${a.toLocaleString()}만</td><td class="num">${u.toLocaleString()}만</td>
    <td class="num">${bal.toLocaleString()}만</td>
    <td><div class="bar"><i style="width:${rate}%;background:${col}"></i></div><span class="muted">${rate}%</span></td></tr>`;
  }).join('');
}
